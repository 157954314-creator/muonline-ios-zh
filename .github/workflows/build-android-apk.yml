name: Build Android APK

on:
  push:
    branches:
      - android-apk
  workflow_dispatch:
    inputs:
      server_host:
        description: 'Default OpenMU ConnectServer Host (can be changed on phone at startup)'
        required: false
        default: '192.168.50.116'
      server_port:
        description: 'Default OpenMU ConnectServer Port'
        required: false
        default: '44405'
      build_mode:
        description: 'Build mode: Fast (JIT, ~6 min) or FullAot (ARM64 AOT+LLVM, ~25 min)'
        type: choice
        default: 'Fast'
        options:
          - Fast
          - FullAot

jobs:
  build-android-apk:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      NUGET_XMLDOC_MODE: skip
      MSBUILDDISABLENODEREUSE: 1
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: false

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (API 36)
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;27.2.12479018
          accept-android-sdk-licenses: true

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: .nuget/packages
          key: android-apk-nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Build.props', 'MuAndroid/**/*.csproj', 'Client.Main/**/*.csproj', 'Client.Data/**/*.csproj', 'Client.Telemetry/**/*.csproj') }}
          restore-keys: |
            android-apk-nuget-${{ runner.os }}-

      - name: Restore Android workload
        shell: pwsh
        run: dotnet workload restore MuAndroid/MuAndroid.csproj --skip-manifest-update

      - name: Restore MonoGame MGCB tool
        shell: pwsh
        run: dotnet tool restore --tool-manifest MuAndroid/.config/dotnet-tools.json

      - name: Patch appsettings.json for Android
        shell: pwsh
        run: |
          $path = "Client.Main/appsettings.json"
          $json = Get-Content $path -Raw | ConvertFrom-Json
          $hostVal = "${{ inputs.server_host }}"
          if ([string]::IsNullOrWhiteSpace($hostVal)) { $hostVal = "192.168.50.116" }
          $portVal = "${{ inputs.server_port }}"
          if ([string]::IsNullOrWhiteSpace($portVal)) { $portVal = "44405" }
          $json.MuOnlineSettings.ConnectServerHost = $hostVal
          $json.MuOnlineSettings.ConnectServerPort = [int]$portVal
          if ($json.MuOnlineSettings.QuickLogin) {
            $json.MuOnlineSettings.QuickLogin.Enabled = $false
            $json.MuOnlineSettings.QuickLogin.AutoSubmit = $false
          }
          $json | ConvertTo-Json -Depth 10 | Set-Content $path -Encoding UTF8

      - name: Build Android ARM64 APK (Fast mode)
        if: ${{ inputs.build_mode != 'FullAot' }}
        shell: pwsh
        run: |
          $outDir = "artifacts/android-apk"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          $verCode = [int]"${{ github.run_number }}"
          if ($verCode -lt 2) { $verCode = 2 }
          $verName = "1.0.$verCode"
          Write-Host "Building Android APK version $verName (code $verCode) with fixed signing keystore"
          dotnet restore MuAndroid/MuAndroid.csproj `
            -r android-arm64 `
            --disable-parallel `
            -p:AndroidPerformanceRelease=false `
            -p:AndroidPackageFormats=apk `
            -p:RestoreMonoGameTools=false `
            -p:AcceptAndroidSdkLicenses=true
          dotnet publish MuAndroid/MuAndroid.csproj `
            -c Release `
            -f net10.0-android `
            -r android-arm64 `
            -o $outDir `
            --no-restore `
            --disable-build-servers `
            -m:1 `
            -p:ApplicationVersion=$verCode `
            -p:ApplicationDisplayVersion=$verName `
            -p:AndroidKeyStore=true `
            -p:AndroidSigningKeyStore=Signing/mumono-dev.p12 `
            -p:AndroidSigningKeyAlias=mumono `
            -p:AndroidSigningKeyPass=mumono123 `
            -p:AndroidSigningStorePass=mumono123 `
            -p:AndroidPerformanceRelease=false `
            -p:AndroidPackageFormats=apk `
            -p:RestoreMonoGameTools=false `
            -p:AcceptAndroidSdkLicenses=true
          Get-ChildItem $outDir -Filter *.apk | Select-Object Name, Length

      - name: Build Android ARM64 APK (FullAot mode)
        if: ${{ inputs.build_mode == 'FullAot' }}
        shell: pwsh
        run: >
          ./scripts/publish/android-performance.ps1
          -Mode FullAot
          -PackageFormats apk
          -RuntimeIdentifier android-arm64
          -OutputDirectory artifacts/android-apk
          -SkipWorkloadRestore
          -SkipToolRestore
          -NoArchive

      - name: Collect Signed APK & Generate version.json
        shell: pwsh
        run: |
          $signed = Get-ChildItem "artifacts/android-apk" -Filter "*-Signed.apk" -Recurse | Select-Object -First 1
          if (-not $signed) {
            $signed = Get-ChildItem "artifacts/android-apk" -Filter "*.apk" -Recurse | Select-Object -First 1
          }
          if (-not $signed) {
            Write-Error "No APK produced!"
            exit 1
          }
          New-Item -ItemType Directory -Path "release-apk" -Force | Out-Null
          $dest = "release-apk/MuMono-Android-arm64.apk"
          Copy-Item $signed.FullName $dest -Force

          $verCode = [int]"${{ github.run_number }}"
          if ($verCode -lt 2) { $verCode = 2 }
          $verName = "1.0.$verCode"
          $commitMsg = (git log -1 --pretty=%s)
          $manifest = [ordered]@{
            versionCode = $verCode
            versionName = $verName
            apkUrl      = "https://github.com/${{ github.repository }}/releases/download/android-latest/MuMono-Android-arm64.apk"
            notes       = $commitMsg
            publishedAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content "release-apk/version.json" -Encoding UTF8
          Get-Content "release-apk/version.json"
          Get-Item $dest | Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,2)}}

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MuMono-Android-APK
          path: release-apk/MuMono-Android-arm64.apk
          if-no-files-found: error

      - name: Publish Direct Download Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "android-latest"
          $apk = "release-apk/MuMono-Android-arm64.apk"
          $verJson = "release-apk/version.json"
          $verCode = [int]"${{ github.run_number }}"
          if ($verCode -lt 2) { $verCode = 2 }
          $verName = "1.0.$verCode"
          $notes = "MuMono Android ARM64 APK v$verName (Build $verCode, 自动构建于 $(Get-Date -Format 'yyyy-MM-dd HH:mm') UTC)`n`n直接点击下方 **MuMono-Android-arm64.apk** 下载安装即可（免解压，支持 App 内自动检测更新与无缝覆盖安装）。"
          $exists = $true
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { $exists = $false }
          if ($exists) {
            gh release upload $tag $apk $verJson --clobber
            gh release edit $tag --title "MuMono Android APK (v$verName)" --notes $notes
          } else {
            gh release create $tag $apk $verJson --title "MuMono Android APK (v$verName)" --notes $notes --prerelease=false
          }
